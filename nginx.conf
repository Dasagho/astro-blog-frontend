server {
  listen 80;
  root /app/dist;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;

  location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ =404;
  }

  error_page 404 /404.html;
}
